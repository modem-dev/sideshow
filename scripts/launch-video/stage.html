<!doctype html>
<!--
  1920x1080 recording stage for sideshow release/feature videos.

  Styled after the sideshow.sh "Matinee" aesthetic (sideshow-cloud
  web/site/site.css): warm bone canvas, ink type, one vermilion accent, a soft
  spotlight, Instrument Serif marquee headlines, Inter body. The window frame
  echoes the site's .marquee screenshot frame (dark bar, warm border, deep
  soft shadow).

  The live viewer loads into the framed "browser window" iframe; a driver
  script (record.mjs) records this page with Playwright video while calling
  the window.stage API to move captions and title cards. Tokens __INTER__ /
  __MONO__ / __SERIF__ / __SERIF_ITALIC__ / __APP_URL__ / __APP_HOST__ are
  substituted by record.mjs before the page is loaded (from a work-dir copy).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "InterVideo";
        src: url("__INTER__") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "MonoVideo";
        src: url("__MONO__") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: "SerifVideo";
        src: url("__SERIF__") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "SerifVideo";
        src: url("__SERIF_ITALIC__") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      :root {
        /* Matinee palette — keep in sync with sideshow-cloud web/site/site.css */
        --bg: #f4f1ea;
        --surface: #ffffff;
        --border: #e4ded2;
        --ink: #16151a;
        --muted: #56514a;
        --soft: #6f6a60;
        --faint: #8a8478;
        --accent: #e8442f;
        --frame: #1d212a;
        --sans: "InterVideo", "Inter", system-ui, sans-serif;
        --serif: "SerifVideo", "Instrument Serif", Georgia, serif;
        --mono: "MonoVideo", ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--ink);
      }
      /* the site's hero spotlight — a soft vermilion glow from above */
      .spot {
        position: absolute;
        top: -220px;
        left: 50%;
        transform: translateX(-50%);
        width: 1100px;
        height: 760px;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(232, 68, 47, 0.1), transparent 60%);
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
      }

      /* --- framed browser window (the site's .marquee treatment) ------------ */
      .window {
        position: absolute;
        left: 160px;
        top: 44px;
        width: 1600px;
        height: 864px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow:
          0 52px 100px -60px rgba(22, 21, 26, 0.5),
          0 12px 36px -24px rgba(22, 21, 26, 0.3);
        background: var(--surface);
      }
      .chrome {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        background: var(--frame);
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot.r {
        background: #f0564a;
      }
      .dot.y {
        background: #e0a63c;
      }
      .dot.g {
        background: #58b368;
      }
      .urlbar {
        margin: 0 auto;
        padding: 5px 40px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #9aa3ad;
        font: 14px/1 var(--mono);
      }
      iframe#app {
        display: block;
        width: 1600px;
        height: 819px;
        border: 0;
        background: var(--surface);
      }

      /* --- caption lower third ---------------------------------------------- */
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 52px;
        display: flex;
        justify-content: center;
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }
      .caption.show {
        opacity: 1;
        transform: translateY(0);
      }
      .caption .inner {
        display: flex;
        align-items: center;
        gap: 20px;
        max-width: 1500px;
        font-size: 31px;
        font-weight: 500;
        letter-spacing: 0.1px;
        text-align: center;
        color: var(--ink);
      }
      /* the site's .kicker: uppercase, letterspaced, vermilion — no pill */
      .caption .badge,
      .card-overlay .badge {
        font-family: var(--sans);
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }
      .caption .hl {
        color: var(--accent);
        font-weight: 600;
      }
      .caption .dim {
        color: var(--soft);
        font-weight: 400;
      }

      /* --- full-screen title cards ------------------------------------------ */
      .card-overlay {
        /* purely visual — never intercept the driver's clicks into the iframe */
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        opacity: 1;
        transition: opacity 0.55s ease;
      }
      .card-overlay.hidden {
        opacity: 0;
      }
      .card-overlay .box {
        position: relative;
        z-index: 2;
        text-align: center;
      }
      .card-overlay .badge {
        display: block;
        margin-bottom: 26px;
      }
      .card-overlay h1 {
        font: 400 108px/1 var(--serif);
        color: var(--ink);
        margin: 0 0 22px;
        letter-spacing: -1px;
      }
      .card-overlay h1 em,
      .card-overlay h1 .ver {
        font-style: italic;
        color: var(--accent);
      }
      .card-overlay .sub {
        font-size: 32px;
        line-height: 1.5;
        color: var(--muted);
        font-weight: 400;
      }
      .card-overlay .cmds {
        margin: 48px auto 0;
        display: inline-flex;
        flex-direction: column;
        gap: 14px;
      }
      .card-overlay .cmd {
        font: 28px/1.4 var(--mono);
        background: var(--frame);
        border-radius: 10px;
        padding: 15px 36px;
        color: #f4f1ea;
        box-shadow: 0 18px 40px -28px rgba(22, 21, 26, 0.55);
      }
      .card-overlay .cmd .p {
        color: var(--accent);
      }
      .card-overlay .foot {
        margin-top: 44px;
        font-size: 24px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="spot"></div>
      <div class="window">
        <div class="chrome">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="urlbar">__APP_HOST__</span>
        </div>
        <iframe id="app" src="__APP_URL__"></iframe>
      </div>
      <div class="caption" id="caption"><div class="inner" id="captionInner"></div></div>
      <div class="card-overlay" id="card">
        <div class="spot"></div>
        <div class="box" id="cardBox"></div>
      </div>
    </div>
    <script>
      // Driver API — called from record.mjs via page.evaluate.
      const captionEl = document.getElementById("caption");
      const captionInner = document.getElementById("captionInner");
      const cardEl = document.getElementById("card");
      const cardBox = document.getElementById("cardBox");
      window.stage = {
        // Swap the lower-third caption (slide out, replace, slide in).
        caption(html) {
          captionEl.classList.remove("show");
          setTimeout(
            () => {
              captionInner.innerHTML = html;
              captionEl.classList.add("show");
            },
            html ? 300 : 0,
          );
        },
        // Show a full-screen title card (covers the window + captions).
        card(html) {
          cardBox.innerHTML = html;
          cardEl.classList.remove("hidden");
        },
        hideCard() {
          cardEl.classList.add("hidden");
        },
      };
    </script>
  </body>
</html>
