<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.55" stop-color="#a21caf"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="520"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Inter, system-ui, sans-serif">
    <rect width="1200" height="520" fill="url(#bg)"/>

    <!-- right-side brand motif: concentric orbits around the Meridian mark -->
    <g fill="none" stroke="#ffffff">
      <circle cx="1010" cy="252" r="150" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="1010" cy="252" r="240" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="1010" cy="252" r="66" stroke-opacity="0.92" stroke-width="4"/>
      <line x1="944" y1="252" x2="1076" y2="252" stroke-opacity="0.92" stroke-width="4"/>
    </g>
    <circle cx="1142" cy="150" r="9" fill="#ffffff" fill-opacity="0.65"/>
    <circle cx="905" cy="392" r="6" fill="#ffffff" fill-opacity="0.45"/>

    <!-- brand lockup -->
    <g transform="translate(64,52)">
      <circle cx="18" cy="18" r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="3" y1="18" x2="33" y2="18" stroke="#ffffff" stroke-width="2.5"/>
      <text x="48" y="27" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="0.4">Meridian</text>
    </g>

    <!-- eyebrow -->
    <text x="65" y="170" fill="#ffffff" fill-opacity="0.8" font-size="15" font-weight="600" letter-spacing="3.5">OBSERVABILITY · MMXXVI</text>

    <!-- headline -->
    <text x="62" y="252" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="-1.2">Catch the outage</text>
    <text x="62" y="324" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="-1.2">before users do.</text>

    <!-- subhead -->
    <text x="64" y="374" fill="#ffffff" fill-opacity="0.86" font-size="22" font-weight="400">Real-time monitoring for teams that ship fast.</text>

    <!-- CTA -->
    <rect x="64" y="406" width="188" height="54" rx="27" fill="#ffffff"/>
    <text x="92" y="440" fill="#a21caf" font-size="19" font-weight="700">Start free</text>
    <path d="M 210 433 h 16 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#a21caf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="276" y="440" fill="#ffffff" fill-opacity="0.82" font-size="16" font-weight="400">14-day trial · no card</text>

    <!-- footer -->
    <text x="65" y="494" fill="#ffffff" fill-opacity="0.72" font-size="15" font-weight="500">meridian.dev</text>
  </g>
</svg>
