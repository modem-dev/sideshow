<style>
  .zoo-wrap {
    font-family: var(--font-sans);
    color: var(--color-text-primary);
  }
  .zoo-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .zoo-row button {
    flex: 1;
    min-width: 160px;
  }
  .legend {
    font: 12px var(--font-sans);
    color: var(--color-text-tertiary);
    margin-top: 10px;
  }
</style>
<div class="zoo-wrap">
  <svg width="100%" viewBox="0 0 680 220">
    <!-- nodes -->
    <g class="c-blue node" onclick="sendPrompt('Walk me through the API edge layer')">
      <rect class="box" x="10" y="80" width="120" height="48" />
      <text class="th" x="70" y="100" text-anchor="middle">Client</text>
      <text class="ts" x="70" y="116" text-anchor="middle">retries x3</text>
    </g>
    <g class="c-teal node" onclick="sendPrompt('Show the API handler code')">
      <rect class="box" x="190" y="80" width="120" height="48" />
      <text class="th" x="250" y="100" text-anchor="middle">API</text>
      <text class="ts" x="250" y="116" text-anchor="middle">202 + job id</text>
    </g>
    <g class="c-amber node" onclick="sendPrompt('How deep can the queue get?')">
      <rect class="box" x="370" y="80" width="120" height="48" />
      <text class="th" x="430" y="100" text-anchor="middle">Queue</text>
      <text class="ts" x="430" y="116" text-anchor="middle">at-least-once</text>
    </g>
    <g class="c-green node" onclick="sendPrompt('What is the worker backoff schedule?')">
      <rect class="box" x="550" y="80" width="120" height="48" />
      <text class="th" x="610" y="100" text-anchor="middle">Worker</text>
      <text class="ts" x="610" y="116" text-anchor="middle">backoff</text>
    </g>
    <!-- connectors -->
    <line class="arr" x1="130" y1="104" x2="186" y2="104" marker-end="url(#arrow)" />
    <line class="arr" x1="310" y1="104" x2="366" y2="104" marker-end="url(#arrow)" />
    <line class="arr" x1="490" y1="104" x2="546" y2="104" marker-end="url(#arrow)" />
    <!-- retry loop -->
    <path
      class="arr"
      d="M 610 128 C 610 185, 250 185, 250 130"
      fill="none"
      marker-end="url(#arrow)"
    />
    <text class="ts" x="430" y="178" text-anchor="middle">
      on failure: re-enqueue with jittered backoff
    </text>
  </svg>
  <div class="zoo-row">
    <button onclick="sendPrompt('Stress-test this: what happens at 10k req/s?')">
      Stress-test it
    </button>
    <button onclick="sendPrompt('Where could a message get lost in this flow?')">
      Find the failure mode
    </button>
  </div>
  <div class="legend">
    An <b>html</b> part — you author the markup, it renders sandboxed. Every box and button is wired
    to <code>sendPrompt()</code>: click one and the text lands as a comment on this card.
  </div>
</div>
